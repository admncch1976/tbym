
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>t/M - Talk Before You Marry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }

      @keyframes flowGradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      @keyframes shineEffect {
        0% { text-shadow: 0 0 0px rgba(255,255,255,0); }
        50% { text-shadow: 0 0 15px rgba(255,255,255,0.8), 0 0 5px rgba(26,75,88,0.2); }
        100% { text-shadow: 0 0 0px rgba(255,255,255,0); }
      }

      .animated-text-glow {
        background: linear-gradient(90deg, #1A4B58, #8B3A4D, #1A4B58);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: flowGradient 6s ease-in-out infinite;
      }

      .shining-quote {
        animation: shineEffect 4s ease-in-out infinite;
      }

      .serif-quote {
        font-family: 'Playfair Display', serif;
      }
    </style>
